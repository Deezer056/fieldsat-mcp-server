name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-agrivibe
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  ECR_REPOSITORY: agrivibe-backend
  CONTAINER_NAME: backend
  ECS_CLUSTER: agrivibe
  ECS_SERVICE: agrivibe
  TASK_FAMILY: agrivibe

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      - run: uvx ruff check src tests evals
      - run: uv run pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest   
    environment: course      
    steps:
      - uses: actions/checkout@v7

      - name: Log in to AWS with OIDC (no stored keys)
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2.1.7

      - uses: docker/setup-buildx-action@v4.4.1

      - name: Build and push (tag = commit SHA; the repository refuses to overwrite a tag)
        id: build
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Download the running task definition
        run: |
          aws ecs describe-task-definition --task-definition "$TASK_FAMILY" \
            --query taskDefinition > task-definition.json

      - name: Put the new image, by digest, into this repository's container only
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1.9.1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}@${{ steps.build.outputs.digest }}

      - name: Register the revision and roll the service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2.6.4
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          wait-for-service-stability: true # fails the run if the new task never turns healthy